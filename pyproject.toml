[project]
name = "maibot-phone-play"
version = "0.1.3"
description = "MaiBot 插件「刷会儿手机」：让 Bot 用安卓手机、模拟器或 iPhone 自己刷视频、逛帖子、听歌、看小说，支持 WebUI 实时观看"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "maibot-plugin-sdk>=2.12.0,<3",
  "pillow>=10.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.12"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B"]
